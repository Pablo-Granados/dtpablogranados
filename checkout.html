<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leé el partido — Checkout</title>
  <link rel="icon" type="image/png" href="/image/dtpablogranados.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-dark': '#05070a',
            'card-dark': '#0f1218',
            accent: '#00f2ff',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-bg-dark font-sans tactical-bg min-h-screen">

  <nav class="w-full py-6 px-6 md:px-12">
    <a href="/" class="inline-flex items-center gap-3">
      <img src="https://i.postimg.cc/0N7nQMXQ/Logo-DTPG.png" alt="DT PG Logo" class="h-9 w-9 brightness-125 object-contain" />
      <span class="text-sm font-black tracking-tighter uppercase italic">DTPabloGranados</span>
    </a>
  </nav>

  <main class="max-w-2xl mx-auto px-6 pb-24 pt-6 md:pt-12">
    <div id="checkout-content"></div>
  </main>

  <script src="js/config.js"></script>
  <script>
    const cfg = SITE_CONFIG.ebook;
    const root = document.getElementById("checkout-content");

    const items = cfg.incluye.map(i => `
      <li class="flex gap-4 items-start py-4 border-b border-white/5 last:border-0">
        <span class="text-2xl leading-none shrink-0">${i.emoji}</span>
        <div>
          <p class="font-black uppercase italic tracking-tight text-sm md:text-base">${i.titulo}</p>
          <p class="text-white/40 text-xs md:text-sm mt-1 leading-relaxed">${i.descripcion}</p>
        </div>
      </li>
    `).join("");

    root.innerHTML = `
      <div class="text-center mb-10">
        <img src="${cfg.imagen}" alt="${cfg.titulo}" class="w-100 mx-auto rounded-lg shadow-2xl mb-8" />
        <span class="text-[10px] font-black uppercase tracking-[0.4em] text-accent">Pack completo</span>
        <h1 class="mt-4 text-3xl md:text-4xl font-black uppercase italic tracking-tighter leading-none">${cfg.titulo}</h1>
        <p class="mt-3 text-white/50 font-medium italic">${cfg.subtitulo}</p>
        <div class="mt-6 inline-flex items-center gap-2 bg-accent/10 border border-accent/30 px-5 py-2">
          <span class="text-[10px] font-black uppercase tracking-widest text-accent">🔥 35% OFF — Solo para los primeros 50</span>
        </div>
      </div>

      <div class="sport-card p-6 md:p-8 mb-8">
        <span class="text-[10px] font-black uppercase tracking-[0.4em] text-accent/70">¿Qué vas a recibir?</span>
        <ul class="mt-2">${items}</ul>
      </div>

      <div class="sport-card p-8 text-center bg-accent/5 border-accent/30 mb-8">
        <p class="text-[10px] font-black uppercase tracking-widest text-white/40 mb-2">Precio promocional</p>
        <div class="flex items-center justify-center gap-4 flex-wrap">
          <span class="text-4xl md:text-5xl font-black italic text-accent glow-text">${cfg.precio}</span>
          ${cfg.precioRegular ? `<span class="text-lg text-white/30 line-through font-bold">${cfg.precioRegular}</span>` : ""}
        </div>
        <p class="mt-4 text-[10px] font-black uppercase tracking-widest text-accent/70">⚠️ Oferta válida únicamente para los primeros 50 compradores</p>
      </div>

      <a href="${cfg.checkoutUrl}" target="_blank" rel="noopener"
         class="w-full flex items-center justify-center gap-4 bg-accent text-black py-6 text-sm font-black uppercase tracking-[0.2em] hover:bg-white transition-all">
        Comprar ahora
        <i data-lucide="arrow-right" class="w-5 h-5"></i>
      </a>

      <p class="text-center text-[10px] text-white/20 uppercase tracking-widest mt-6">
        Pago 100% seguro a través de Mercado Pago
      </p>
    `;
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
