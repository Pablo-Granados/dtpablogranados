<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Gracias! — DT Pablo Granados</title>
  <link rel="icon" type="image/png" href="/image/dtpablogranados.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-dark': '#05070a',
            'card-dark': '#0f1218',
            accent: '#00f2ff',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-bg-dark font-sans tactical-bg min-h-screen flex items-center justify-center px-6">

  <div class="max-w-xl w-full text-center py-20">

    <div class="inline-flex items-center gap-3 bg-accent/10 border border-accent/20 px-6 py-2 mb-10">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping-slow absolute inline-flex h-full w-full rounded-full bg-accent opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-accent"></span>
      </span>
      <span class="text-[10px] font-black uppercase tracking-[0.4em] text-accent">Pago aprobado</span>
    </div>

    <h1 class="text-4xl md:text-6xl font-black uppercase italic tracking-tighter leading-[0.9] mb-6">
      Bienvenido a la<br />
      <span class="text-accent glow-text">Primera Generación</span>
    </h1>

    <p class="text-white/50 font-medium leading-relaxed mb-2 text-lg">
      Tu pago fue realizado correctamente.
    </p>
    <p class="text-white/40 font-medium leading-relaxed mb-12 max-w-md mx-auto">
      Para recibir tu material y preparar tu certificado personalizado, completá tus datos en el siguiente formulario.
    </p>

    <a href="https://docs.google.com/forms/d/e/1FAIpQLSekbTutry5jr_hTclY7t-EzLaV1tye_76vxLZGUNd1ClqM1CA/viewform" target="_blank" rel="noopener"
       class="inline-flex items-center gap-4 bg-accent text-black px-12 py-6 text-sm font-black uppercase tracking-[0.2em] hover:bg-white transition-all">
      Completar datos
      <i data-lucide="arrow-right" class="w-5 h-5"></i>
    </a>

    <div class="mt-16">
      <a href="/" class="text-[10px] font-black uppercase tracking-[0.3em] text-white/30 hover:text-accent transition-colors">
        ← Volver al inicio
      </a>
    </div>

  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</body>
</html>
